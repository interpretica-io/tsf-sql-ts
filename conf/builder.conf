# The engine and the agent are built for the same platform: the agent runs
# on the engine host. tapi_sql reaches a database through the agent's
# RPC server, so this suite has a real agent with an RPC server, and
# the database client libraries live in that server.
TE_PLATFORM([], [], [-D_GNU_SOURCE], [], [],
            [logger_core tools logic_expr conf_oid rpcxdr rpc_types \
             ipc bsapi loggerten rcfapi confapi comm_net_engine rcfunix \
             tapi rcfrpc tapi_env tapi_rpc tapi_tad trc log_proc asn ndn \
             ta_job tapi_job tapi_tool \
             netconf rpctransport agentlib loggerta comm_net_agent rpcs_job \
             rpcserver rcfpch tad])

# The external library under test. Its reference lives in
# conf/external.yml and the commit actually built in
# conf/builder.conf.lock. The three libraries bind to the two sides:
# ta_sql and rpcs_sql onto the agent (listed again in the RPC server
# application below), tapi_sql onto the engine.
TE_EXT_REPO_USE([tsf_sql], [], [ta_sql rpcs_sql tapi_sql])

# The sql_* RPCs. The platform is shared by engine and agent, so one
# declaration wires rpcxdr (engine) and rpcxdrta (agent) both. See
# ta_sql/sql_rpc.x.m4.
TE_LIB_PARMS([rpcxdr], [], [],
             [--with-rpcdefs=tarpc_job.x.m4,../ta_sql/sql_rpc.x.m4])

TE_TOOLS([rgt trc])

TE_TOOL_PARMS([trc], [--with-popups --with-log-urls])

TE_APP_PARMS([tester], [--with-trc])

# One Test Agent of the stock unix flavour.
# The traffic engine restricted to the protocols needed; without this the
# meson build pulls the full default set, which includes SNMP and is
# unsupported under meson.
TE_LIB_PARMS([tapi_tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])
TE_LIB_PARMS([tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

TE_TA_TYPE([linux], [], [unix],
           [--with-rcf-rpc --without-static-libc],
           [], [], [], [comm_net_agent rcfpch ndn asn])

# The database client libraries ta_sql links, by pkg-config name:
# whichever of SQLite, libpq and MariaDB Connector/C the build host has.
# Every driver is optional; ta_sql is built with the ones found.
TS_SQL_DEPS="libpcre2-8"
for ts_sql_dep in sqlite3 libpq libmariadb ; do
    if pkg-config --exists "${ts_sql_dep}" ; then
        TS_SQL_DEPS="${TS_SQL_DEPS} ${ts_sql_dep}"
    fi
done

# The RPC server application. tapi_sql's RPCs run here, so it links the
# agent-side ta_sql (the connections, the statements, the drivers) and
# rpcs_sql (the sql_* RPCs) on top of the stock RPC server. The agent
# host must carry the client library of every engine it is to test:
# libsqlite3, libpq, libmariadb with their development headers (the
# Docker image has all three). A test of an engine whose driver is not
# linked in skips. See the tsf-sql README.
TE_TA_APP([ta_rpcprovider], [], [linux],
          [ta_rpcprovider], [], [],
          [ta_sql rpcs_sql \
           conf_oid ta_job comm_net_agent rpcs_job rpcserver agentlib rpcxdrta \
           rpc_types rpctransport loggerta tools logger_core \
           netconf],
          [\${EXT_SOURCES}/build.sh --extra-deps='${TS_SQL_DEPS}'],
          [ta_rpcs], [])

. $TE_BASE/engine/builder/te_functions
. $TE_BASE/engine/builder/te_ta_ssh_helper
